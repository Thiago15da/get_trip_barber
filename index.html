<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Trip Barber Club | Reservas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #eeb93a; --bg: #121212; --card: #1e1e1e; --text: #f4f1ea; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; }
        
        .container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; 
            background: linear-gradient(rgba(18,18,18,0.9), rgba(18,18,18,0.9)), url('https://images.unsplash.com/photo-1585747860715-2ba37e788b70?q=80&w=2074&auto=format&fit=crop');
            background-size: cover; background-position: center; }

        .form-card { background: var(--card); padding: 40px; border-radius: 4px; width: 100%; max-width: 500px; border: 1px solid #333; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        
        h1 { font-family: 'Oswald', sans-serif; color: var(--gold); text-align: center; font-size: 2.2rem; letter-spacing: 3px; margin-bottom: 10px; text-transform: uppercase; }
        p.subtitle { text-align: center; color: #888; font-size: 0.8rem; margin-bottom: 30px; letter-spacing: 1px; }

        .field { margin-bottom: 20px; }
        label { display: block; font-family: 'Oswald', sans-serif; color: var(--gold); font-size: 0.75rem; letter-spacing: 1.5px; margin-bottom: 8px; text-transform: uppercase; }
        
        input, select { width: 100%; padding: 12px; background: #000; border: 1px solid #444; color: white; font-family: 'Montserrat', sans-serif; transition: 0.3s; }
        input:focus { border-color: var(--gold); outline: none; }

        .btn-submit { width: 100%; padding: 15px; background: var(--gold); border: none; font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.4s; letter-spacing: 2px; margin-top: 10px; }
        .btn-submit:hover { background: #d4a22c; transform: translateY(-2px); }
        .btn-submit:disabled { background: #444; cursor: not-allowed; }

        #status { margin-top: 20px; padding: 15px; text-align: center; font-size: 0.85rem; display: none; border-radius: 2px; }
    </style>
</head>
<body>

<div class="container">
    <div class="form-card">
        <h1>Get Trip</h1>
        <p class="subtitle">BARBER CLUB • RESERVAS ONLINE</p>
        
        <form id="bookingForm">
            <div class="field">
                <label>Nombre Completo</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ej: Thiago David">
            </div>

            <div class="field">
                <label>Email de Confirmación</label>
                <input type="email" id="email" name="email" required placeholder="tu@email.com">
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="field" style="flex: 1;">
                    <label>Fecha</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>
                <div class="field" style="flex: 1;">
                    <label>Hora</label>
                    <input type="time" id="hora" name="hora" required min="09:00" max="20:00" step="1800">
                </div>
            </div>

            <div class="field">
                <label>Servicio</label>
                <select id="servicio" name="servicio">
                    <option value="Corte de Autor">Corte de Autor</option>
                    <option value="Ritual de Barba">Ritual de Barba</option>
                    <option value="Combo Get Trip">Combo Get Trip</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">AGENDAR TURNO</button>
            <div id="status"></div>
        </form>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwl409sE2RRnV2bExxtiIPsTOBHywOsd9d-sCdmlxsu_sYqHzQ2997-bhMYwIX05oSM/exec';
    const form = document.getElementById('bookingForm');
    const btn = document.getElementById('submitBtn');
    const status = document.getElementById('status');

    // Bloquear fechas pasadas
    document.getElementById('fecha').min = new Date().toISOString().split("T")[0];

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.disabled = true;
        btn.innerText = "PROCESANDO...";
        status.style.display = "block";
        status.style.background = "#222";
        status.style.color = var(--gold);
        status.innerText = "Verificando disponibilidad...";

        const formData = {
            nombre: document.getElementById('nombre').value,
            email: document.getElementById('email').value,
            fecha: document.getElementById('fecha').value,
            hora: document.getElementById('hora').value,
            servicio: document.getElementById('servicio').value
        };

        fetch(scriptURL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: JSON.stringify(formData)
        })
        .then(() => {
            status.style.background = "#1b4332";
            status.style.color = "#8fce00";
            status.innerText = "¡Éxito! Tu reserva ha sido enviada. Revisá tu email.";
            form.reset();
            btn.disabled = false;
            btn.innerText = "AGENDAR TURNO";
        })
        .catch(error => {
            status.style.background = "#431b1b";
            status.style.color = "#ff4d4d";
            status.innerText = "Error de conexión. Intentá de nuevo.";
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
