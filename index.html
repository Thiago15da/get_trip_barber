<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Trip | Reservas</title>
    <style>
        :root { --gold: #eeb93a; --bg: #121212; --card: #1e1e1e; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; padding: 20px; }
        .booking-card { background: var(--card); padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: var(--gold); text-align: center; text-transform: uppercase; letter-spacing: 2px; }
        label { display: block; margin-bottom: 8px; color: var(--gold); font-size: 0.75rem; font-weight: bold; }
        input, select { width: 100%; padding: 12px; margin-bottom: 20px; background: #000; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        input:focus { border-color: var(--gold); outline: none; }
        .btn { width: 100%; padding: 15px; background: var(--gold); border: none; font-weight: bold; cursor: pointer; transition: 0.3s; border-radius: 4px; }
        .btn:hover { background: #d4a22c; transform: translateY(-2px); }
        .btn:disabled { background: #555; cursor: not-allowed; }
        #statusMsg { margin-top: 15px; text-align: center; font-size: 0.85rem; padding: 10px; border-radius: 4px; display: none; }
    </style>
</head>
<body>

<div class="booking-card">
    <h2>Agendar Turno</h2>
    <p style="text-align: center; color: #888; font-size: 0.8rem; margin-bottom: 20px;">Atención de 09:00 a 20:00 hs</p>
    
    <form id="reservaForm">
        <label>NOMBRE COMPLETO</label>
        <input type="text" id="nombre" required placeholder="Ej: Thiago Escobar">

        <label>CORREO ELECTRÓNICO</label>
        <input type="email" id="email" required placeholder="Para recibir tu confirmación">

        <label>FECHA</label>
        <input type="date" id="fecha" required>

        <label>HORARIO (Intervalos de 30 min)</label>
        <input type="time" id="hora" required min="09:00" max="20:00" step="1800">

        <label>SERVICIO</label>
        <select id="servicio">
            <option value="Corte de Autor">Corte de Autor</option>
            <option value="Perfilado de Barba">Perfilado de Barba</option>
            <option value="Combo Get Trip">Combo Get Trip</option>
        </select>

        <button type="submit" class="btn" id="btnSubmit">CONFIRMAR RESERVA</button>
        <div id="statusMsg"></div>
    </form>
</div>

<script>
    // 1. Limitar fecha a hoy o futuro
    const inputFecha = document.getElementById('fecha');
    const hoy = new Date().toISOString().split("T")[0];
    inputFecha.setAttribute('min', hoy);

    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwndYyLKWj21LtS4tf2Mk6vdqaeE7EjRRzmj24Dw7pdjG6iNTQpBy__RJx-7mfHHWcm/exec';

    document.getElementById('reservaForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        const msg = document.getElementById('statusMsg');

        btn.disabled = true;
        btn.innerText = "VERIFICANDO...";
        msg.style.display = "block";
        msg.style.background = "#333";
        msg.style.color = "white";
        msg.innerText = "Procesando tu reserva...";

        const payload = {
            nombre: document.getElementById('nombre').value,
            email: document.getElementById('email').value,
            fecha: document.getElementById('fecha').value,
            hora: document.getElementById('hora').value,
            servicio: document.getElementById('servicio').value
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(payload)
        })
        .then(() => {
            msg.style.background = "#2e7d32";
            msg.innerText = "¡Listo! Revisá tu correo para la confirmación.";
            this.reset();
            btn.disabled = false;
            btn.innerText = "CONFIRMAR RESERVA";
        })
        .catch(err => {
            msg.style.background = "#c62828";
            msg.innerText = "Error al conectar. Intentá de nuevo.";
            btn.disabled = false;
            btn.innerText = "CONFIRMAR RESERVA";
        });
    });
</script>

</body>
</html>
