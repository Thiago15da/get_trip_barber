<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Trip Barber Club | Reservas</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --brand-yellow: #eeb93a;
            --brand-yellow-hover: #d4a22c;
            --text-light: #f4f1ea;
            --text-muted: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        h1, h2, h3 { font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 1px; }

        header {
            position: fixed;
            top: 0; width: 100%;
            background: rgba(18, 18, 18, 0.95);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid #333;
        }

        .logo-text { color: var(--brand-yellow); font-size: 1.5rem; font-weight: 700; font-family: 'Oswald', sans-serif; }

        nav a { margin-left: 20px; font-size: 0.9rem; font-weight: 600; text-decoration: none; color: inherit; transition: color 0.3s; }
        nav a:hover { color: var(--brand-yellow); }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            background: linear-gradient(rgba(18, 18, 18, 0.8), rgba(18, 18, 18, 0.9)), url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=1950&q=80') center/cover;
        }

        .hero h1 { font-size: 4rem; color: var(--brand-yellow); margin-bottom: 10px; }
        .hero p { font-size: 1.2rem; color: var(--text-muted); max-width: 600px; margin-bottom: 30px; }

        .btn {
            background-color: var(--brand-yellow);
            color: #000;
            padding: 15px 30px;
            border: none;
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        .btn:hover { background-color: var(--brand-yellow-hover); transform: translateY(-3px); }
        .btn:disabled { background-color: #555; cursor: not-allowed; }

        .reservas { padding: 100px 5%; text-align: center; }
        .section-title { font-size: 2.5rem; margin-bottom: 50px; color: var(--brand-yellow); }

        .form-container {
            max-width: 500px;
            margin: 0 auto;
            background-color: var(--bg-card);
            padding: 40px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .form-group { margin-bottom: 25px; text-align: left; }
        .form-group label { display: block; margin-bottom: 10px; font-family: 'Oswald', sans-serif; color: var(--brand-yellow); }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background-color: #121212;
            border: 1px solid #444;
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
        }

        footer { padding: 50px 5%; text-align: center; background: #0a0a0a; border-top: 1px solid var(--brand-yellow); }

        #mensajeEstado { margin-top: 20px; font-weight: 600; display: none; min-height: 24px; }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">GET TRIP</div>
        <nav>
            <a href="#inicio">INICIO</a>
            <a href="#reservas">RESERVAS</a>
        </nav>
    </header>

    <section class="hero" id="inicio">
        <h1>GET TRIP</h1>
        <p>Barbería de autor. Reservá tu lugar y viví la experiencia en cada detalle.</p>
        <a href="#reservas" class="btn">PEDIR TURNO</a>
    </section>

    <section class="reservas" id="reservas">
        <h2 class="section-title">Agendá tu visita</h2>
        <div class="form-container">
            <form id="reservaForm">
                <div class="form-group">
                    <label>TU NOMBRE</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Thiago Alvarez">
                </div>
                <div class="form-group">
                    <label>SERVICIO</label>
                    <select id="servicio" name="servicio">
                        <option value="Corte de Autor">Corte de Autor</option>
                        <option value="Barba">Ritual de Barba</option>
                        <option value="Combo Completo">Combo Completo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>FECHA</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>
                <div class="form-group">
                    <label>HORA</label>
                    <input type="time" id="hora" name="hora" required min="09:00" max="20:00">
                </div>
                <button type="submit" class="btn" style="width: 100%;" id="btnEnviar">CONFIRMAR TURNO</button>
                <p id="mensajeEstado"></p>
            </form>
        </div>
    </section>

    <footer>
        <p>© 2026 Get Trip Barber Club</p>
        <p style="font-size: 0.8rem; margin-top: 10px; color: var(--text-muted);">Developed by NovaTec</p>
    </footer>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx1QiCJop-HZi-Yj4IXUM3kcFcx-kWkPlXixulu_AK_KEr6MP6MGvFiizRP1jK66R0/exec';
        const form = document.getElementById('reservaForm');
        const btnEnviar = document.getElementById('btnEnviar');
        const mensajeEstado = document.getElementById('mensajeEstado');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            btnEnviar.disabled = true;
            btnEnviar.innerText = "PROCESANDO...";
            mensajeEstado.style.display = "block";
            mensajeEstado.style.color = "var(--brand-yellow)";
            mensajeEstado.innerText = "Guardando tu cita...";

            const datos = {
                nombre: document.getElementById('nombre').value,
                servicio: document.getElementById('servicio').value,
                fecha: document.getElementById('fecha').value,
                hora: document.getElementById('hora').value
            };

            fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify(datos),
                headers: { 'Content-Type': 'application/json' }
            })
            .then(response => {
                mensajeEstado.style.color = "#4CAF50";
                mensajeEstado.innerText = "¡Excelente! Tu turno ha sido agendado.";
                form.reset();
                btnEnviar.disabled = false;
                btnEnviar.innerText = "CONFIRMAR TURNO";
            })
            .catch(error => {
                console.error('Error!', error.message);
                mensajeEstado.style.color = "#f44336";
                mensajeEstado.innerText = "Hubo un problema. Reintentá en unos segundos.";
                btnEnviar.disabled = false;
                btnEnviar.innerText = "CONFIRMAR TURNO";
            });
        });
    </script>
</body>
</html>
